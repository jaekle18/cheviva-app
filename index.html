<!DOCTYPE html>
<html lang="es">
<head>
<base target="_blank">
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
  :root { --seal:#99271F; --seal-dark:#7E1F19; --ink:#17140F; --paper:#FBFAF8; --kraft:#DED2BC; --muted:#6F6759; --ph:#EDE7DC; --white:#FFFFFF; --ok:#2E7D32; --warn:#B26A00; }
  html, body { margin: 0; background: var(--paper); }
  body { font: 18px/1.45 'Archivo', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--ink); }
  main { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 12px; text-align: center;
         padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); }
  p { margin: 0; max-width: 340px; overflow-wrap: anywhere; }
  a { color: var(--seal); font-weight: 600; }
</style>
</head>
<body>
<main>
<p id="enviadas" hidden></p>
<p>Cheviva se mudó: <a href="https://app.cheviva.workers.dev/" rel="noopener">app.cheviva.workers.dev</a></p>
</main>
<script>
/* The old address hands over (S17). Built by tools/construir-mudanza.py; read its header first. */
(function () {
  var NUEVA = "https://app.cheviva.workers.dev", CLAVE = "cheviva-codigo", COLA = "cheviva-cola", GUARDADOS = "cheviva-datos";
  var HECHAS = "cheviva-" + 'entregadas', LECTURA = "cheviva-" + 'lectura-entregada', TELEFONO = "cheviva-" + 'entrega-telefono';
  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function poner(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lista(k) { try { var x = JSON.parse(leer(k) || '[]'); return Array.isArray(x) ? x : []; } catch (e) { return []; } }
  var hechas = lista(HECHAS);
  function pintar() {
    var p = document.getElementById('enviadas'), n = hechas.length;
    p.textContent = n === 1 ? '1 entrada enviada a la dirección nueva' : n + ' entradas enviadas a la dirección nueva';
    p.hidden = !n;
  }
  pintar();
  // the password the old page keeps, read as the old door read it (capitals, letters and digits only); never asked for
  var clave = String(leer(CLAVE) || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  var S = window.crypto && window.crypto.subtle;
  if (!clave || !S || !window.TextEncoder || !window.fetch) return;   // nothing to sign with: what waits stays on this phone
  var E = new TextEncoder();
  function hex(b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  var tel = leer(TELEFONO);
  if (!/^[0-9a-f]{24}$/.test(tel || '')) { var r = new Uint8Array(12); window.crypto.getRandomValues(r); tel = hex(r); poner(TELEFONO, tel); }
  var llave = S.importKey('raw', E.encode(clave), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  function enviar(tipo, texto) {
    return llave.then(function (k) { return S.sign('HMAC', k, E.encode('entrega-1\n' + tipo + '\n' + tel + '\n' + texto)); })
      .then(function (f) {
        return fetch(NUEVA + '/entrega', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, cache: 'no-store', credentials: 'omit',
                                           body: JSON.stringify({ tipo: tipo, telefono: tel, cuerpo: texto, firma: hex(f) }) });
      })
      .then(function (r) { return r.json(); });
  }
  var cola = lista(COLA).filter(function (e) { return e && typeof e.codigo === 'string' && hechas.indexOf(e.codigo) < 0; })
    .sort(function (a, b) { return (Number(a.creado) || 0) - (Number(b.creado) || 0); });
  var leida = leer(GUARDADOS);
  function siguiente(i) {
    if (i < cola.length) {
      var e = cola[i];
      return enviar('entrada', JSON.stringify(e)).then(function (r) {
        if (r && r.ok === true) { hechas.push(e.codigo); poner(HECHAS, JSON.stringify(hechas)); pintar(); return siguiente(i + 1); }
        if (r && r.error === 'entrada no válida') return siguiente(i + 1);   // the door cannot read this one: it stays here
        // a refused signature, a wait, or the door's own trouble: the rest stay here and go at the next opening
      });
    }
    if (!leida) return;
    return S.digest('SHA-256', E.encode(leida)).then(function (h) {
      h = hex(h);
      if (leer(LECTURA) === h) return;
      return enviar('lectura', leida).then(function (r) { if (r && r.ok === true) poner(LECTURA, h); });
    });
  }
  siguiente(0).catch(function () {});   // no signal or no answer: everything stays here and goes at the next opening
})();
</script>
</body>
</html>
